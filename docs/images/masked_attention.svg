<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Masked self-attention</title>
  <desc id="desc">A matrix-style view of causal masking where each token can only attend to earlier tokens and itself.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Masked Self-Attention</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Each character predicts the next one using only previous context.</text>
  <g transform="translate(260 105)" font-family="Arial, sans-serif" font-size="14">
    <text x="-95" y="35" fill="#334155">current token</text>
    <text x="125" y="-20" fill="#334155">tokens allowed as context</text>
    <g fill="#0f172a" font-weight="700">
      <text x="25" y="-5" text-anchor="middle">T1</text>
      <text x="85" y="-5" text-anchor="middle">T2</text>
      <text x="145" y="-5" text-anchor="middle">T3</text>
      <text x="205" y="-5" text-anchor="middle">T4</text>
      <text x="-20" y="33" text-anchor="middle">T1</text>
      <text x="-20" y="93" text-anchor="middle">T2</text>
      <text x="-20" y="153" text-anchor="middle">T3</text>
      <text x="-20" y="213" text-anchor="middle">T4</text>
    </g>
    <g stroke="#cbd5e1">
      <rect x="0" y="10" width="50" height="50" fill="#bbf7d0"/>
      <rect x="60" y="10" width="50" height="50" fill="#fee2e2"/>
      <rect x="120" y="10" width="50" height="50" fill="#fee2e2"/>
      <rect x="180" y="10" width="50" height="50" fill="#fee2e2"/>
      <rect x="0" y="70" width="50" height="50" fill="#bbf7d0"/>
      <rect x="60" y="70" width="50" height="50" fill="#bbf7d0"/>
      <rect x="120" y="70" width="50" height="50" fill="#fee2e2"/>
      <rect x="180" y="70" width="50" height="50" fill="#fee2e2"/>
      <rect x="0" y="130" width="50" height="50" fill="#bbf7d0"/>
      <rect x="60" y="130" width="50" height="50" fill="#bbf7d0"/>
      <rect x="120" y="130" width="50" height="50" fill="#bbf7d0"/>
      <rect x="180" y="130" width="50" height="50" fill="#fee2e2"/>
      <rect x="0" y="190" width="50" height="50" fill="#bbf7d0"/>
      <rect x="60" y="190" width="50" height="50" fill="#bbf7d0"/>
      <rect x="120" y="190" width="50" height="50" fill="#bbf7d0"/>
      <rect x="180" y="190" width="50" height="50" fill="#bbf7d0"/>
    </g>
    <g fill="#14532d" font-size="18" font-weight="700">
      <text x="25" y="42" text-anchor="middle">yes</text>
      <text x="85" y="102" text-anchor="middle">yes</text>
      <text x="145" y="162" text-anchor="middle">yes</text>
      <text x="205" y="222" text-anchor="middle">yes</text>
    </g>
  </g>
  <g transform="translate(570 145)" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">
    <rect x="0" y="0" width="240" height="46" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="120" y="29" text-anchor="middle">visible context</text>
    <rect x="0" y="70" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="120" y="99" text-anchor="middle">future tokens hidden</text>
  </g>
</svg>
